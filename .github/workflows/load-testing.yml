name: CLEAR PATH Baseline Load Testing & Excel Performance Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  load-test:
    name: Execute 100 VU Baseline Load Test & Generate Excel Report
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl requests
          pip install -r clear-path-backend/clear-path-backend/requirements.txt

      - name: ⚡ Setup Grafana k6 Engine
        uses: grafana/setup-k6-action@v1

      - name: 🚀 Start FastAPI Backend Server
        run: |
          cd clear-path-backend/clear-path-backend
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 > backend.log 2>&1 &
          PID=$!
          echo "FastAPI Backend PID: $PID"
          echo "Waiting for FastAPI backend readiness on http://127.0.0.1:8000/health..."
          
          MAX_RETRIES=60
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if ! kill -0 $PID 2>/dev/null; then
              echo "❌ Backend process crashed during startup! Log output:"
              cat backend.log
              exit 1
            fi
            
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/health || echo "000")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ FastAPI Backend is Online and Healthy (HTTP 200)!"
              break
            fi
            
            sleep 1
            RETRY_COUNT=$((RETRY_COUNT+1))
          done
          
          if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
            echo "❌ Backend readiness check timed out! Log output:"
            cat backend.log
            exit 1
          fi

      - name: 🧪 Execute Baseline Load Test (100 VUs / 60s)
        env:
          LOAD_TEST_BASE_URL: http://127.0.0.1:8000
          LOAD_TEST_EMAIL: doctor@clearpath.ai
          LOAD_TEST_PASSWORD: doctor123
        run: |
          cd load-tests
          mkdir -p reports/excel reports/json reports/html
          k6 run scripts/baseline_load_test.js || true

      - name: 📊 Process Metrics & Generate Excel Report
        id: report_gen
        run: |
          cd load-tests
          python utils/generate_excel_report.py

      - name: 📤 Upload Performance Reports & Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CLEAR-PATH-LOAD-TEST-REPORT
          path: |
            load-tests/reports/excel/ClearPath_Load_Test_Report.xlsx
            load-tests/reports/html/ClearPath_Load_Test_Report.html
            load-tests/reports/json/ClearPath_Load_Test_Raw.json
            clear-path-backend/clear-path-backend/backend.log
          retention-days: 30

      - name: 📋 Display Load Testing Summary
        if: always()
        run: |
          echo "================================================="
          echo "CLEAR PATH BASELINE LOAD TESTING CI/CD REPORT"
          echo "================================================="
          echo "Target Backend     : http://127.0.0.1:8000"
          echo "Virtual Users      : 100 VUs (Peak)"
          echo "Duration           : 60 Seconds"
          echo "Excel Report Path  : load-tests/reports/excel/ClearPath_Load_Test_Report.xlsx"
          echo "HTML Report Path   : load-tests/reports/html/ClearPath_Load_Test_Report.html"
          echo "Artifact Uploaded  : CLEAR-PATH-LOAD-TEST-REPORT"
          echo "================================================="
